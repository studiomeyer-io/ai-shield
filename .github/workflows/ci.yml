name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking on ERRORS only: eslint exits 0 while warnings remain, so the
      # 9 known review-warnings (preserve-caught-error, unused vars in tests,
      # `any` in test mocks) surface in the log without red-gating the build.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  typecheck-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: ReDoS growth regression
        run: npm run bench:redos

      - name: Package entrypoints
        run: npm run test:package-exports

      - name: Real OpenAI SDK compatibility
        run: npm run test:openai-compat

      - name: OpenAI declared peer contract
        run: npm run test:openai-peers

      - name: Anthropic declared peer contract
        run: npm run test:anthropic-peers

      - name: Legacy Gemini declared peer contract
        run: npm run test:gemini-peers

      - name: New adapter SDK peer contracts
        if: matrix.node-version == 22
        run: npm run test:new-sdk-peers

      - name: Google GenAI declared Node.js floor
        if: matrix.node-version == 20
        run: npm run test:new-sdk-peers -- google-genai

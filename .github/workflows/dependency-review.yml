name: Dependency Review

# Blocks a PR that introduces a dependency with a known high/critical
# advisory. PR-only, so it never touches the main-branch build. Pairs with the
# existing Dependabot config (.github/dependabot.yml), which auto-applies
# security advisories out of band — this action stops a vulnerable dep from
# entering via a human PR in the first place.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        # Non-blocking: the studiomeyer-io org has "Dependency graph for new
        # repositories" disabled, so this repo was created without a dependency
        # graph and the action hard-errors "not supported on this repository"
        # on every PR. continue-on-error keeps the check green (and it still
        # posts a PR summary once the graph is enabled) instead of gating every
        # Dependabot PR for a setting the repo can't satisfy. Supply-chain
        # safety stays covered by Dependabot security updates + CodeQL.
        # Re-tighten by enabling the dependency graph, then dropping this line.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          # Only high/critical fails the check — core ships zero runtime deps,
          # so in practice this gates the dev/peer dependency surface.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
